name: SEO audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: seo-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit static-site SEO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only SEO audit
        run: python .github/scripts/seo_audit.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: |
            seo-audit-report.md
            seo-audit-report.json
          if-no-files-found: error
          retention-days: 30
